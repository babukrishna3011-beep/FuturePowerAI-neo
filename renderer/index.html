  body::before { /* readability veil */
    content:''; position:fixed; inset:0;
    background:radial-gradient(ellipse at 50% 30%, rgba(5,10,30,.25), rgba(3,6,18,.78) 80%);
    pointer-events:none; z-index:0;
  }
  .app { position:relative; z-index:1; height:100vh; max-width:860px; margin:0 auto;
         display:flex; flex-direction:column; padding:18px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 4px 16px; }
  .orb { width:44px; height:44px; border-radius:50%;
         background:conic-gradient(from 120deg,#38e1ff,#7a5cff,#ff5ca8,#38e1ff);
         box-shadow:0 0 24px rgba(80,180,255,.7); animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.08);opacity:1} }
  h1 { font-size:1.35rem; letter-spacing:3px; font-weight:700;
       background:linear-gradient(90deg,#7ce7ff,#c9a7ff,#ff9ed2);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .status { margin-left:auto; font-size:.72rem; color:#8fd8ff; letter-spacing:1px;
            display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3dffa0;
         box-shadow:0 0 10px #3dffa0; animation:pulse 2s infinite; }
  .modes { display:flex; gap:8px; margin-bottom:12px; }
  .mode { flex:1; padding:9px 0; text-align:center; border-radius:12px; cursor:pointer;
          border:1px solid rgba(140,190,255,.25); background:rgba(20,35,70,.45);
          backdrop-filter:blur(10px); color:#a9c6ef; font-size:.82rem; letter-spacing:1px;
          transition:.25s; user-select:none; }
  .mode.active { background:linear-gradient(135deg,rgba(56,150,255,.35),rgba(150,80,255,.35));
                 color:#fff; border-color:rgba(140,220,255,.7); box-shadow:0 0 18px rgba(80,160,255,.35); }
  .chat { flex:1; overflow-y:auto; padding:14px; border-radius:18px;
          background:rgba(8,14,34,.55); backdrop-filter:blur(14px);
          border:1px solid rgba(140,190,255,.18); display:flex; flex-direction:column; gap:12px; }
  .chat::-webkit-scrollbar { width:6px; } .chat::-webkit-scrollbar-thumb { background:rgba(120,180,255,.3); border-radius:3px; }
  .msg { max-width:78%; padding:12px 16px; border-radius:16px; line-height:1.55; font-size:.92rem;
         white-space:pre-wrap; word-break:break-word; animation:rise .35s ease; }
  @keyframes rise { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  .msg.ai  { align-self:flex-start; background:rgba(40,70,140,.5); border:1px solid rgba(120,200,255,.28);
              border-bottom-left-radius:4px; }
  .msg.user{ align-self:flex-end; background:linear-gradient(135deg,rgba(56,140,255,.45),rgba(150,80,255,.45));
              border-bottom-right-radius:4px; }
  .msg b { color:#8fe3ff; } .msg .ans { color:#3dffa0; font-size:1.15rem; font-weight:700; }
  .typing span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%;
                 background:#8fd8ff; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:.75rem; padding:6px 12px; border-radius:999px; cursor:pointer;
          background:rgba(60,110,220,.3); border:1px solid rgba(140,190,255,.3); color:#bcd8ff; transition:.2s; }
  .chip:hover { background:rgba(90,150,255,.45); transform:translateY(-2px); }
  .inputbar { display:flex; gap:10px; margin-top:12px; }
  #inp { flex:1; padding:14px 18px; border-radius:14px; border:1px solid rgba(140,190,255,.3);
         background:rgba(10,18,42,.7); color:#eaf2ff; font-size:.95rem; outline:none; backdrop-filter:blur(10px); }
  #inp:focus { border-color:#5ec8ff; box-shadow:0 0 16px rgba(80,180,255,.3); }
  #send { padding:0 26px; border:none; border-radius:14px; cursor:pointer; font-weight:700;
          letter-spacing:1px; color:#fff; background:linear-gradient(135deg,#2f7bff,#8b4dff);
          box-shadow:0 4px 18px rgba(70,120,255,.45); transition:.2s; }

<script>
window.FPAI_API_BASE='https://futurepoweraiplus.pro15.workers.dev';
/* FuturePowerAIPlus 3.0 UI: local-first, with explicit user-controlled online access. */
'use strict';
let MODE = 'auto';

/* ---------------- safe math engine (no eval) ---------------- */
function tokenize(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){let n='';while(i<s.length&&/[0-9.]/.test(s[i]))n+=s[i++];t.push({type:'num',v:parseFloat(n)});continue;}
    if(/[a-zA-Z]/.test(c)){let w='';while(i<s.length&&/[a-zA-Z]/.test(s[i]))w+=s[i++];t.push({type:'fn',v:w.toLowerCase()});continue;}
    if('+-*/^()%!,√π'.includes(c)){t.push({type:'op',v:c});i++;continue;}
    throw new Error('Unexpected character: '+c);
  }
  return t;
}
function parseExpr(tk){
  let p=0;
  const peek=()=>tk[p], next=()=>tk[p++];
  function expr(){let v=term();while(peek()&&peek().v==='+'||peek()&&peek().v==='-'){const o=next().v,r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){let v=factor();for(;;){const q=peek();if(!q)break;
    if(q.type==='op'&&(q.v==='*'||q.v==='/'||q.v==='%')){const o=next().v,r=factor();if(o==='*')v*=r;else if(o==='/'){if(r===0)throw new Error('Division by zero');v/=r;}else v%=r;continue;}
    if(q.type==='num'||q.type==='fn'||q.v==='('||q.v==='√'||q.v==='π'){v*=factor();continue;}
    break;}return v;}
  function factor(){let v=unary();if(peek()&&peek().v==='^'){next();v=Math.pow(v,factor());}return v;}
  function unary(){if(peek()&&peek().v==='-'){next();return -unary();}if(peek()&&peek().v==='+'){next();return unary();}return atom();}
  function atom(){
    const t=next();
    if(!t)throw new Error('Incomplete expression');
    if(t.type==='num')return t.v;
    if(t.type==='op'&&t.v==='('){const v=expr();if(!peek()||peek().v!==')')throw new Error('Missing )');next();return v;}
    if(t.type==='op'&&t.v==='√')return Math.sqrt(unary());
    if(t.type==='fn'){
      if(t.v==='pi')return Math.PI;
      if(t.v==='e')return Math.E;
      const F={sqrt:Math.sqrt,sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),
        tan:x=>Math.tan(x*Math.PI/180),log:Math.log10,ln:Math.log,exp:Math.exp,
        abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,
        min:(x,y)=>Math.min(x,y),max:(x,y)=>Math.max(x,y),pow:Math.pow};
      if(!(t.v in F))throw new Error('Unknown function: '+t.v);
      if(peek()&&peek().v==='('){
        next();const a=expr();let b=null;
        if(peek()&&peek().v===','){next();b=expr();}
        if(!peek()||peek().v!==')')throw new Error('Missing )');next();
        if((t.v==='min'||t.v==='max'||t.v==='pow')&&b===null)throw new Error(t.v+' needs ( )');
        if(t.v==='sqrt'&&a<0)throw new Error('sqrt of negative number');
        return b===null?F[t.v](a):F[t.v](a,b);
      }
      /* implicit argument: sin45, sqrt 16, log 1000 */
      if(t.v==='min'||t.v==='max'||t.v==='pow')throw new Error(t.v+' needs ( )');
      const a2=unary();
      if(t.v==='sqrt'&&a2<0)throw new Error('sqrt of negative number');
      return F[t.v](a2);
    }
    throw new Error('Bad token: '+t.v);
  }
  const v=expr();
  if(p<tk.length)throw new Error('Unexpected trailing input');
  return v;
}
function tryMath(s){
  const clean=s.replace(/\d{1,3}(?:,\d{3})+/g,m=>m.replace(/,/g,'')).replace(/×/g,'*').replace(/÷/g,'/').replace(/mod/g,'%')
               .replace(/percent of (\d+(?:\.\d+)?)/,'*($1/100)');
  if(!/[0-9(√]/.test(clean)||!/[\d(]/.test(clean))return null;
  const v=parseExpr(tokenize(clean));
  if(typeof v!=='number'||!isFinite(v))throw new Error('Result is not finite');
  return v;
}
function fmt(n){return Math.abs(n-Math.round(n))<1e-10?String(Math.round(n)):String(+n.toPrecision(12));}

/* extract "X% of Y" style questions */
function pctOf(s){
  const m=s.match(/([\d.]+)\s*%\s*of\s*([\d.]+)/i);
  if(!m)return null;
  return {pct:+m[1],base:+m[2],ans:+m[1]/100*+m[2]};
}

/* ---------------- explanation engine ---------------- */
const KNOWLEDGE={
  gravity:"Gravity is the mutual attraction between masses. Newton's law: F = G·m₁·m₂ / r² — every mass pulls every other mass. Earth pulls you (9.8 m/s² downward); you pull Earth back, just imperceptibly. Einstein reframed it: mass curves spacetime, and objects follow those curves.",
  photosynthesis:"Photosynthesis is how plants make food: 6CO₂ + 6H₂O + sunlight → C₆H₁₂O₆ + 6O₂. Chlorophyll in leaves captures light energy, splits water, and fixes carbon dioxide into glucose, releasing the oxygen we breathe.",
  "black hole":"A black hole is a region where gravity is so strong that escape velocity exceeds light speed. The event horizon marks the point of no return. Nothing — not even light — escapes. Stellar-mass ones form when massive stars collapse.",
  dna:"DNA (deoxyribonucleic acid) is the molecule carrying genetic instructions. It's a double helix of nucleotides (A, T, G, C); A pairs with T, G with C. Your genome is the recipe book for building and running you.",
  "big bang":"The Big Bang is the origin of our universe ~13.8 billion years ago: space itself expanded from an extremely hot, dense state. Evidence: cosmic microwave background radiation and the expansion of galaxies (Hubble's law).",
  evolution:"Evolution is change in populations over generations via variation and natural selection. Organisms best suited to their environment leave more offspring, so advantageous traits spread. Over deep time this produces new species.",
  "machine learning":"Machine learning is programming by example: instead of hand-writing rules, a model learns patterns from data. A neural network adjusts millions of weights to minimize error, enabling image recognition, translation and chat.",
  "quantum computing":"Quantum computing uses qubits, which can be 0 and 1 simultaneously (superposition) and can correlate (entanglement). This lets certain problems — factoring, simulation, search — be attacked in fundamentally new ways.",
  "solar system":"Our solar system: the Sun plus 8 planets — Mercury, Venus, Earth, Mars (rocky), then Jupiter, Saturn, Uranus, Neptune (gas/ice giants) — plus dwarf planets, moons, asteroids and comets.",
  internet:"The internet is a global network of networks using shared protocols (TCP/IP). Data is split into packets, routed across physical links — cables, fiber, satellites — and reassembled. The web is one service running on top of it.",
  inflation:"Inflation is the general rise in prices over time, usually measured by the CPI. Moderate inflation (~2%) signals a growing economy; high inflation erodes savings and purchasing power.",
  "water cycle":"The water cycle: the sun evaporates water → vapor rises and cools → condenses into clouds → falls as rain/snow → collects in oceans, rivers and groundwater → repeat.",
  "speed of light":"The speed of light in vacuum is exactly 299,792,458 m/s (~300,000 km/s). It's the cosmic speed limit for information and matter, and a core constant in relativity: E = mc²."
};
function explain(topic){
  const t=topic.toLowerCase();
  for(const k in KNOWLEDGE) if(t.includes(k)) return KNOWLEDGE[k];
  return null;
}

/* ---------------- conversation engine ---------------- */
const GREETS=["hello","hi","hey","namaste","salaam","hola"];
const jokes=["Why do programmers prefer dark mode? Because light attracts bugs. 🐛",
  "I told my computer I needed a break… now it won't stop sending me KitKat ads.",
  "Why did the math book look sad? Too many problems.",
  "Parallel lines have so much in common… it's a shame they'll never meet."];
const facts=["Honey never spoils — 3,000-year-old Egyptian honey is still edible.",
  "Octopuses have three hearts and blue blood.",
  "A day on Venus is longer than a year on Venus.",
  "Bananas are berries, but strawberries aren't."];
function converse(text){
  const t=text.toLowerCase().trim();
  if(GREETS.some(g=>t===g||t.startsWith(g+' '))) return "Hello! 👋 I'm FuturePowerAIPlus — your keyless AI. I can calculate anything (try <b>sqrt(144)+3^3</b>), explain science topics, or just chat. What would you like?";
  if(/how are you/.test(t)) return "Running at 100% capacity, zero failures so far ⚡. More importantly — how are <i>you</i>?";
  if(/your name|who are you/.test(t)) return "I'm <b>FuturePowerAIPlus</b> — a fully self-contained, keyless, cloud-style AI. No API keys, no servers, no downtime. I live entirely in this page.";
  if(/joke|funny|make me laugh/.test(t)) return jokes[Math.floor(Math.random()*jokes.length)];
  if(/fact|something interesting/.test(t)) return "🧠 Random fact: "+facts[Math.floor(Math.random()*facts.length)];
  if(/thank/.test(t)) return "You're most welcome! Anything else on your mind?";
  if(/bye|goodbye|see you/.test(t)) return "Goodbye! I'll be right here whenever you return — I never sleep. ✨";
  if(/help|what can you do/.test(t)) return "Here's what I do best:<br>🧮 <b>Calculate</b> — arithmetic, powers, sqrt, sin/cos, log, %, e.g. <b>(12+8)*3^2</b><br>📖 <b>Explain</b> — try 'explain gravity', 'photosynthesis', 'black hole', 'DNA'…<br>📐 <b>Calculus</b> — <b>integrate 3x^2+2x-5</b>, <b>differentiate x^3-4x</b><br>💬 <b>Converse</b> — greetings, jokes, facts, small talk.";
  if(/love|like you/.test(t)) return "That's very kind! I like you too — in a completely compute-bound way. 💙";
  if(t.endsWith('?')) return "Great question. My knowledge base covers 13 science topics — try rephrasing with a keyword like <b>gravity</b>, <b>evolution</b>, <b>internet</b> or <b>inflation</b>. For numbers, just type the expression and I'll solve it instantly.";
  return "Interesting! Try one of these:<br>• A math expression, e.g. <b>2^10 / 4</b><br>• “explain” + a topic (gravity, DNA, black hole…)<br>• Say <b>help</b> to see everything I can do.";
}

/* ---------------- calculus engine (polynomials in x) ---------------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b?gcd(b,a%b):a;}
function sup(n){const M={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};return String(n).split('').map(c=>M[c]||c).join('');}
function coefStr(c,den){ /* exact fraction when possible, else decimal */
  const n0=Math.round(c);
  if(Math.abs(c-n0)<1e-9){const g=gcd(n0||1,den),nn=n0/g,dd=den/g;return dd===1?String(nn):nn+'/'+dd;}
  return String(+c.toFixed(4));
}
function bodyOf(cs,p){ /* coefficient string + x^p, parenthesizing fractions */
  if(p===0)return cs;
  const c=(cs.indexOf('/')>=0)?'('+cs+')':cs;
  return (cs==='1'?'':c)+'x'+(p===1?'':sup(p));
}
function showTerm(c,p){ /* signed display of one polynomial term */
  const neg=c<0,a=Math.abs(c);
  if(Math.abs(a)<1e-12)return '0';
  if(p===0)return (neg?'-':'')+String(+a.toFixed(4));
  const cs=Math.abs(a-1)<1e-12?'1':String(+a.toFixed(4));
  return (neg?'-':'')+bodyOf(cs,p);
}
function joinSigned(items){ /* items: [{neg,core}] → "x² - 3x + 5" */
  let s='';
  for(const it of items){ if(!it.core||it.core==='0')continue;
    s = s==='' ? (it.neg?'-':'')+it.core : s+(it.neg?' - ':' + ')+it.core; }
  return s||'0';
}
function parsePoly(s){
  s=s.toLowerCase().replace(/\s+/g,'').replace(/[⋅·×]/g,'*').replace(/−/g,'-');
  if(!s||!/^[+\-\d.x*^]+$/.test(s))return null;
  const parts=s.replace(/-/g,'+-').split('+').filter(x=>x!=='');
  const terms=[];
  for(const part of parts){
    const m=part.match(/^([+-]?(?:\d+\.?\d*|\.\d+)?)\*?(?:x(?:\^?(\d+))?)?$/);
    if(!m)return null;
    const cs=m[1];
    const c=(cs===''||cs==='+')?1:(cs==='-'?-1:parseFloat(cs));
    const p=part.indexOf('x')>=0?(m[2]?parseInt(m[2]):1):0;
    terms.push({c:c,p:p});
  }
  return terms.length?terms:null;
}
function doCalculus(raw,kind){
  let s=raw.trim().replace(/[?.!]+$/,'').trim()
        .replace(/\s*dx$/i,'').replace(/^dx\s*/i,'')
        .replace(/^w\.?\s*r\.?\s*t\.?(?:\s*to)?\s*x\s*/i,'')
        .replace(/^with\s+respect\s+to\s*x\s*/i,'');
  s=s.replace(/^\((.+)\)$/,'$1'); /* one outer paren layer */
  const terms=parsePoly(s);
  if(!terms)return "I do calculus on polynomials in <b>x</b> — try <b>integrate 3x^2+2x-5</b> or <b>differentiate x^3-4x</b>.";
  if(kind==='∫'){
    const steps=[],out=[];
    for(const tm of terms){
      const c=tm.c/(tm.p+1);
      if(Math.abs(tm.c)<1e-12){steps.push(showTerm(tm.c,tm.p)+' → 0');continue;}
      const cs=coefStr(Math.abs(tm.c),tm.p+1),core=bodyOf(cs,tm.p+1);
      steps.push(showTerm(tm.c,tm.p)+' → '+(c<0?'-':'')+core);
      out.push({neg:c<0,core:core});
    }
    return '<b>∫ ('+joinSigned(terms.map(tm=>({neg:tm.c<0,core:bodyOf(coefStr(Math.abs(tm.c),1),tm.p)})))+') dx</b>  <i>(raise each power by 1, divide by the new power)</i>\n'
      +steps.join('\n')+'\n<span class="ans">= '+joinSigned(out)+' + C</span>';
  }
  const steps=[],out=[];
  for(const tm of terms){
    if(tm.p===0){steps.push(showTerm(tm.c,0)+' → 0 <i>(constants drop)</i>');continue;}
    const c=tm.c*tm.p,core=bodyOf(coefStr(Math.abs(c),1),tm.p-1);
    steps.push(showTerm(tm.c,tm.p)+' → '+(c<0?'-':'')+core);
    out.push({neg:c<0,core:core});
  }
  return '<b>d/dx ('+joinSigned(terms.map(tm=>({neg:tm.c<0,core:bodyOf(coefStr(Math.abs(tm.c),1),tm.p)})))+')</b>  <i>(bring the power down, reduce it by 1)</i>\n'
    +steps.join('\n')+'\n<span class="ans">= '+joinSigned(out)+'</span>';
}
function calculus(text){
  try{
    let m=text.match(/(?:indefinite\s+)?(integral|integration|integrate|antiderivative)\s*(?:of|w\.?\s*r\.?\s*t\.?(?:\s*to)?|with\s+respect\s+to)?\s*(.+)/i);
    if(m)return doCalculus(m[2],'∫');
    m=text.match(/d\/dx\s*(?:of)?\s*(.+)/i);
    if(m)return doCalculus(m[1],'d');
    m=text.match(/(?:differentiate|differentiation|derivative\s+of)\s*(?:of)?\s*(.+)/i);
    if(m)return doCalculus(m[1],'d');
  }catch(e){return '⚠️ '+e.message;}
  return null;
}

/* ---------------- main brain ---------------- */
function brain(raw){
  const text=raw.trim();
  if(!text) return "Say something — I'm listening!";
  const calc=calculus(text);
  if(calc)return calc;
  try{
    const mode = MODE==='auto'
      ? (pctOf(text)||/[0-9(√]/.test(text)&&/[\d(]/.test(text) ? 'calculate' : null)
      : MODE;
    if(mode==='calculate'||MODE==='calculate'){
      const p=pctOf(text);
      if(p) return `<b>${p.pct}% of ${p.base}</b>\n= ${p.pct} ÷ 100 × ${p.base}\n<span class="ans">= ${fmt(p.ans)}</span>`;
      const m=tryMath(text);
      if(m!==null) return `<b>${text}</b>\n<span class="ans">= ${fmt(m)}</span>`;
      if(MODE==='calculate') return "I couldn't parse that as math. Try e.g. <b>(12+8)*3^2</b> or <b>20% of 500</b>.";
    }
    if(mode==='explain'||/explain|what is|what's|define|describe|tell me about/.test(text.toLowerCase())){
      const topic=text.replace(/^(please\s+)?(explain|what is|what's|define|describe|tell me about)\s*(to me)?\s*/i,'');
      const e=explain(topic);
      if(e) return e;
      if(MODE==='explain') return "I don't have that topic yet — my library includes gravity, photosynthesis, black holes, DNA, evolution, the Big Bang, machine learning, quantum computing, the solar system, internet, inflation, the water cycle and the speed of light.";
    }
    return converse(text);
  }catch(err){
    return "⚠️ "+err.message+". Try fixing the expression — e.g. <b>sqrt(144)+3^3</b> works great.";
  }
}

/* ---------------- UI ---------------- */
const chat=document.getElementById('chat');
function bubble(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function send(){
  const inp=document.getElementById('inp'),v=inp.value.trim();

  bubble('user',escapeHtml(v));
  currentMessages.push({role:'user',content:v});
  inp.value='';
  const t=bubble('ai','<span class="typing"><span></span><span></span><span></span></span>');

  try{
    if (typeof MODE !== 'undefined' && (MODE==='calculate' || /^(calculate)\s+/i.test(v) || /^[\d\s+\-*/().%^√π]+$/.test(v))) {
      const localMath=brain(v);
      if(localMath && !/I couldn't parse|I don't have that topic yet/i.test(localMath)){
        t.innerHTML='<div class="ai-model-label">🧮 Deterministic calculator</div>'+localMath;
        currentMessages.push({role:'assistant',content:stripHtml(localMath)}); await persistCurrent(); return;
      }
    }
  }catch(_e){}

  try{
    if(window.localAskAI){
      const answer=await window.localAskAI(v);
      if(answer && answer.trim()){
        const selected=window.localAISelectModel?window.localAISelectModel(v):'fast';
        t.innerHTML='<div class="ai-model-label">'+(selected==='deep'?'🧠 SmolLM2 1.7B · local':'⚡ SmolLM2 135M · local')+'</div>'+escapeHtml(answer).replace(/\n/g,'<br>');
        currentMessages.push({role:'assistant',content:answer}); await persistCurrent(); return;
      }
    }
  }catch(localError){ console.warn('LOCAL AI ERROR:',localError); t.innerHTML='<div class="ai-model-label">LOCAL AI ERROR</div>'+escapeHtml(String(localError?.message||localError)); }

  if(!window.futurePowerOnlineAllowed){
    t.innerHTML='<div class="ai-model-label">🔒 Offline mode</div>Local AI could not answer this request. Turn on <b>Internet when needed</b> to allow an online answer.';
    currentMessages.push({role:'assistant',content:'Local AI could not answer. Internet mode was disabled.'}); await persistCurrent(); return;
  }

  try{
    setStatus('ONLINE · SEARCHING');
    const api=window.FPAI_API_BASE||'https://futurepoweraiplus.pro15.workers.dev';
    const response=await fetch(api+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:v,online:true})});
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.error||'Online AI request failed.');
    t.innerHTML='<div class="ai-model-label">🌐 Online · current reference</div>'+escapeHtml(String(data.answer||'')).replace(/\n/g,'<br>');
    currentMessages.push({role:'assistant',content:String(data.answer||'')}); await persistCurrent();
  }catch(error){
    console.error('Online AI error:',error);
    t.innerHTML='<div class="ai-model-label">⚠️ No online result</div>'+escapeHtml(brain(v));
    currentMessages.push({role:'assistant',content:stripHtml(brain(v))}); await persistCurrent();
  }finally{ setStatus(window.futurePowerOnlineAllowed?'ONLINE ALLOWED':'LOCAL · OFFLINE'); chat.scrollTop=chat.scrollHeight; }
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stripHtml(s){const d=document.createElement('div');d.innerHTML=String(s);return d.textContent||d.innerText||'';}
function setStatus(text){const el=document.getElementById('statusText');if(el)el.textContent=text;}

function quick(q){document.getElementById('inp').value=q;send();}
function setMode(el){document.querySelectorAll('.mode').forEach(m=>m.classList.remove('active'));el.classList.add('active');MODE=el.dataset.mode;
  const hints={auto:"⚡ Auto mode: I detect math, explanations, or chat on my own.",
    calculate:"🧮 Calculation mode: give me any expression — (12+8)*3^2, 20% of 500, sqrt(144)+3^3.",
    explain:"📖 Explanation mode: name a topic — gravity, DNA, black hole, inflation…",
    chat:"💬 Conversation mode: greetings, jokes, facts, or just talk to me."};
  bubble('ai',hints[MODE]);}

/* ---------------- global safety net ---------------- */

let currentMessages=[];
let currentChatId='chat-'+Date.now();
const DB_NAME='futurepoweraiplus-local';
function openStore(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('conversations'))db.createObjectStore('conversations',{keyPath:'id'});if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function putStore(store,value){const db=await openStore();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function getStore(store,key){const db=await openStore();return new Promise((resolve,reject)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function persistCurrent(){try{await putStore('conversations',{id:currentChatId,title:(currentMessages.find(x=>x.role==='user')?.content||'Conversation').slice(0,80),messages:currentMessages,updatedAt:Date.now()});}catch(e){console.warn('Save failed',e);}}
async function saveCurrentConversation(){await persistCurrent();setStatus('SAVED · LOCAL');setTimeout(()=>setStatus(window.futurePowerOnlineAllowed?'ONLINE ALLOWED':'LOCAL · OFFLINE'),1200);}
async function exportCurrentConversation(){await persistCurrent();const blob=new Blob([JSON.stringify({app:'FuturePowerAIPlus',version:'3.0',savedAt:new Date().toISOString(),messages:currentMessages},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FuturePowerAIPlus-conversation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function newChat(){currentChatId='chat-'+Date.now();currentMessages=[];chat.innerHTML='';bubble('ai','<b>New conversation</b><br>Your previous conversation remains saved locally when you use Save.');}
async function loadSettings(){try{const s=await getStore('settings','background');if(s?.blob){document.body.style.backgroundImage=`url(${URL.createObjectURL(s.blob)})`;}}catch(e){} }
window.onerror=(m)=>{try{bubble('ai','A tiny glitch was caught and safely neutralized. Everything still works. 🛡️');}catch(e){}return true;};

<script>
(function(){
  const online=document.getElementById('onlineToggle');
  const perf=document.getElementById('performanceMode');
  online.checked=!!window.futurePowerOnlineAllowed;
  perf.value=localStorage.getItem('fpai-performance')||'auto';
  online.addEventListener('change',()=>{window.futurePowerOnlineAllowed=online.checked;localStorage.setItem('fpai-online',online.checked?'1':'0');setStatus(online.checked?'ONLINE ALLOWED':'LOCAL · OFFLINE');});
  perf.addEventListener('change',()=>{window.futurePowerPerformanceMode=perf.value;localStorage.setItem('fpai-performance',perf.value);});
  document.getElementById('bgInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{document.body.style.backgroundImage=`url(${URL.createObjectURL(f)})`;await putStore('settings',{key:'background',blob:f,updatedAt:Date.now()});}catch(err){console.warn('Background save failed',err);}});
  window.loadSettings();
})();
</script>
